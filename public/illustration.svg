<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Elements -->
  <circle cx="300" cy="200" r="150" fill="#E8F5E9" opacity="0.5"/>
  <circle cx="400" cy="100" r="20" fill="#81C784" opacity="0.3"/>
  <circle cx="200" cy="300" r="30" fill="#81C784" opacity="0.2"/>
  
  <!-- Main Character -->
  <g transform="translate(250, 100)">
    <!-- Body -->
    <path d="M50 180 C50 120 150 120 150 180" fill="#81C784"/>
    <circle cx="100" cy="100" r="50" fill="#81C784"/>
    
    <!-- Face -->
    <circle cx="85" cy="90" r="5" fill="#333"/>
    <circle cx="115" cy="90" r="5" fill="#333"/>
    <path d="M85 110 Q100 120 115 110" stroke="#333" stroke-width="3" fill="none"/>
    
    <!-- Heart on Shirt -->
    <path d="M85 160 Q100 180 115 160 Q130 140 115 130 Q100 120 85 130 Q70 140 85 160" fill="white"/>
  </g>

  <!-- Task Card -->
  <g transform="translate(380, 150)">
    <rect x="0" y="0" width="120" height="80" rx="10" fill="white" stroke="#E0E0E0"/>
    <text x="10" y="30" font-family="Arial" font-size="14" fill="#333">Design Task</text>
    <circle cx="100" cy="60" r="15" fill="#81C784" opacity="0.8"/>
    <text x="90" y="65" font-family="Arial" font-size="12" fill="white">84%</text>
  </g>

  <!-- Decorative Elements -->
  <g transform="translate(150, 50)">
    <circle cx="0" cy="0" r="10" fill="#81C784" opacity="0.6"/>
  </g>
  <g transform="translate(450, 300)">
    <circle cx="0" cy="0" r="15" fill="#81C784" opacity="0.4"/>
  </g>

  <!-- Curved Lines -->
  <path d="M150 50 Q200 100 150 150" stroke="#81C784" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M450 250 Q400 300 450 350" stroke="#81C784" stroke-width="2" fill="none" opacity="0.5"/>
</svg> 